name: Build Color Clash Android APK

on:
  push:
    branches: [ "uno-android-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Color Clash source archive
        run: |
          rm -rf color-clash-build
          mkdir color-clash-build
          base64 -d ColorClash-Android-Source.zip > /tmp/ColorClash-Android-Source.zip
          unzip -q /tmp/ColorClash-Android-Source.zip -d color-clash-build
          ls -la color-clash-build
      - name: Build debug APK
        working-directory: color-clash-build
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ColorClash-LAN-APK
          path: color-clash-build/app/build/outputs/apk/debug/app-debug.apk
