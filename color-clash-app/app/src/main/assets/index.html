<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Clash</title><style>*{box-sizing:border-box}body{margin:0;background:#10131a;color:#fff;font-family:Arial,sans-serif;text-align:center}.wrap{max-width:760px;margin:auto;padding:20px}h1{font-size:36px;margin:16px 0 2px}.sub{color:#ffd54a;font-weight:bold}.panel{background:#1b202b;border-radius:22px;padding:18px;margin:18px 0}input,button{width:100%;padding:15px;border:0;border-radius:13px;margin:6px 0;font-size:17px}button{background:#ffd54a;color:#111;font-weight:bold}.secondary{background:#303847;color:#fff}.players{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.player{background:#292f3b;padding:9px 12px;border-radius:12px}.turn{outline:3px solid #ffd54a}.table{display:flex;justify-content:center;align-items:center;gap:20px;margin:22px}.card{width:92px;height:138px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;font-size:25px;border:5px solid #fff;box-shadow:0 4px 10px #0008;margin:5px;cursor:pointer}.red{background:#e53935}.yellow{background:#fbc02d;color:#111}.green{background:#43a047}.blue{background:#1e88e5}.wild{background:linear-gradient(135deg,#e53935 0 25%,#fbc02d 25% 50%,#43a047 50% 75%,#1e88e5 75%)}#hand{display:flex;overflow-x:auto;padding:10px}.small{font-size:14px;color:#adb5c2}.hide{display:none}.code{font-size:32px;letter-spacing:5px;color:#ffd54a;font-weight:bold}</style></head><body><div class="wrap"><h1>COLOR CLASH</h1><div class="sub">LAN CARD GAME</div><div id="home" class="panel"><input id="name" placeholder="اسم اللاعب"><button onclick="createRoom()">إنشاء لعبة</button><input id="roomInput" placeholder="رمز الغرفة" maxlength="5"><button class="secondary" onclick="joinRoom()">دخول الغرفة</button><div id="homeMsg"></div></div><div id="game" class="hide"><div class="panel"><div>رمز الغرفة</div><div id="roomCode" class="code"></div><div id="players" class="players"></div><button id="startBtn" class="hide" onclick="action('/api/start')">ابدأ اللعبة</button><div id="msg"></div></div><div id="board" class="hide"><div id="turnText"></div><div class="table"><div><div class="small">البطاقة الحالية</div><div id="top"></div></div><button style="width:120px" onclick="action('/api/draw')">اسحب بطاقة</button></div><div class="small">بطاقاتك</div><div id="hand"></div></div><button id="restart" class="hide" onclick="action('/api/restart')">لعبة جديدة</button></div></div><script>let room='',pid='',timer;const $=id=>document.getElementById(id);function enc(o){return Object.entries(o).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:enc(data)});return r.json()}async function createRoom(){let j=await post('/api/create',{name:$('name').value});enter(j)}async function joinRoom(){let j=await post('/api/join',{name:$('name').value,room:$('roomInput').value});enter(j)}function enter(j){if(!j.ok){$('homeMsg').textContent=j.error;return}room=j.room;pid=j.playerId;$('home').classList.add('hide');$('game').classList.remove('hide');$('roomCode').textContent=room;poll();timer=setInterval(poll,900)}async function action(path,extra={}){let j=await post(path,{room,playerId:pid,...extra});if(!j.ok)$('msg').textContent=j.error;else $('msg').textContent='';poll()}async function poll(){if(!room)return;let j=await fetch('/api/status?'+enc({room,playerId:pid})).then(r=>r.json());if(!j.ok)return;$('players').innerHTML=j.players.map(p=>`<span class="player ${p.turn?'turn':''}">${p.you?'أنت: ':''}${p.name} (${p.count})</span>`).join('');$('startBtn').classList.toggle('hide',!j.isHost||j.started||j.winner);$('board').classList.toggle('hide',!j.started);$('restart').classList.toggle('hide',!j.winner||!j.isHost);if(j.winner){$('msg').textContent='الفائز: '+j.winner;return}if(!j.started)return;let me=j.players.find(p=>p.you);$('turnText').textContent=me&&me.turn?'دورك الآن':'انتظر دورك';$('top').innerHTML=card(j.top,-1);$('hand').innerHTML=j.hand.map((c,i)=>card(c,i)).join('')}function label(v){return({skip:'⛔',reverse:'↔',draw2:'+2',wild:'WILD',wild4:'+4'})[v]||v}function card(c,i){if(!c)return'';let cl=c.color||'wild';return `<div class="card ${cl}" ${i>=0?`onclick="play(${i},${c.color===null})"`:''}>${label(c.value)}</div>`}function play(i,wild){if(wild){let c=prompt('اختر اللون: red / yellow / green / blue','red');if(!['red','yellow','green','blue'].includes(c))return;action('/api/play',{cardIndex:i,color:c})}else action('/api/play',{cardIndex:i})}</script></body></html>
