<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Clash</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#17110c;color:#fff;font-family:Arial,sans-serif}body{text-align:center;overflow:hidden}.hide{display:none!important}.home{max-width:520px;margin:0 auto;padding:26px}.logo{font-size:40px;font-weight:900}.sub{color:#ffd84d;font-weight:800;margin-bottom:18px}.panel{background:#1d2028;border-radius:22px;padding:18px;box-shadow:0 10px 30px #0008}input,button{width:100%;padding:14px;border:0;border-radius:13px;margin:6px 0;font-size:17px}button{background:#ffd84d;color:#17110c;font-weight:900;cursor:pointer}.secondary{background:#343a46;color:#fff}.joinHint{background:#161a22;padding:10px;border-radius:12px;margin:8px 0;color:#dfe6ef}.roomTools{display:flex;gap:8px;margin-top:8px}.roomTools button{font-size:14px;padding:10px}.table{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 45%,#ad6b36 0,#8b4e27 42%,#633518 78%,#4d2915 100%)}.table:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.11;background:repeating-linear-gradient(2deg,transparent 0 23px,#fff 24px 25px,transparent 26px 48px)}.menuBtn,.chatBtn,.roomBadge,.turnBanner,.playBtn{position:absolute;z-index:20;background:#211711df;color:#fff;border:1px solid #ffffff28;box-shadow:0 5px 14px #0006}.menuBtn{top:18px;left:18px;width:64px;height:64px;border-radius:18px;font-size:33px}.chatBtn{bottom:22px;left:22px;width:64px;height:64px;border-radius:18px;font-size:28px}.roomBadge{top:18px;right:18px;padding:12px 18px;border-radius:18px;font-weight:800}.turnBanner{top:16px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:18px;font-size:18px;font-weight:900;min-width:180px}.turnBanner.you{background:#ffd84de8;color:#1a130c;box-shadow:0 0 0 4px #fff4,0 0 28px #ffd84daa;animation:turnPulse 1s infinite alternate}.opponents{position:absolute;z-index:7;inset:0;pointer-events:none}.opp{position:absolute;width:128px;text-align:center;transition:.2s}.opp.top{top:10px;left:50%;transform:translateX(-50%)}.opp.left{left:18px;top:50%;transform:translateY(-50%)}.opp.right{right:18px;top:50%;transform:translateY(-50%)}.opp.extra1{top:18px;left:25%}.opp.extra2{top:18px;right:25%}.avatar{width:60px;height:60px;border-radius:50%;margin:auto;background:linear-gradient(#d8e7ef,#7892a3);border:4px solid #c8d4dc;position:relative}.opp.active .avatar{border-color:#ffd84d;box-shadow:0 0 0 5px #ffd84d55,0 0 26px #ffd84d;animation:avatarPulse .7s infinite alternate}.opp.active .avatar:after{content:"▼";position:absolute;top:-30px;left:50%;transform:translateX(-50%);color:#ffd84d;font-size:24px;text-shadow:0 2px 5px #000}.nameTag{display:inline-block;margin-top:3px;background:#241710e8;border-radius:10px;padding:4px 12px;font-weight:900;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.countTag{display:inline-block;margin-top:4px;background:#15100de8;border-radius:9px;padding:3px 8px;font-weight:800}.miniCards{position:relative;height:42px;width:88px;margin:3px auto}.back{position:absolute;width:30px;height:42px;border:3px solid #eee;border-radius:5px;background:radial-gradient(ellipse,#e3332c 0 34%,#151515 36% 100%);box-shadow:0 2px 5px #0008}.back:nth-child(1){left:14px;transform:rotate(-14deg)}.back:nth-child(2){left:29px}.back:nth-child(3){left:44px;transform:rotate(14deg)}.center{position:absolute;z-index:8;top:45%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:34px}.deck{width:112px;height:164px;border-radius:15px;border:8px solid #eee;background:radial-gradient(ellipse,#e3332c 0 34%,#151515 36% 100%);box-shadow:0 10px 20px #0009;cursor:pointer;position:relative}.deck:after{content:"DRAW";position:absolute;bottom:-31px;left:50%;transform:translateX(-50%);font-size:13px;background:#24170ee8;padding:5px 9px;border-radius:8px}.card{--card:#222;position:relative;width:112px;height:164px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:58px;border:8px solid #f7f3e9;box-shadow:0 6px 13px #0009,inset 0 0 0 2px #0003;background:var(--card);color:var(--card);overflow:hidden;text-shadow:-2px -2px 0 #111,2px -2px 0 #111,-2px 2px 0 #111,2px 2px 0 #111}.card:before{content:"";position:absolute;width:78%;height:76%;background:#f3efe5;border-radius:52% 30% 52% 30%;transform:rotate(-10deg);box-shadow:inset 0 0 8px #0002}.card .big{position:relative;z-index:2}.card .corner{position:absolute;z-index:3;font-size:19px;color:#fff;text-shadow:-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111,1px 1px 0 #111}.tl{top:8px;left:8px}.br{bottom:8px;right:8px;transform:rotate(180deg)}.red{--card:#ed1c24}.yellow{--card:#ffd400}.green{--card:#079447}.blue{--card:#087ac1}.wild{--card:#171717;background:#171717}.wild:before{background:conic-gradient(#079447 0 25%,#ed1c24 0 50%,#087ac1 0 75%,#ffd400 0);border-radius:50%;width:67%;height:45%}.wild .big{font-size:25px;color:#fff}.action .big{font-size:39px;color:var(--card)}#hand{position:absolute;z-index:12;left:50%;bottom:-28px;width:720px;height:315px;transform:translateX(-50%);pointer-events:none}.handCard{position:absolute;left:50%;bottom:56px;margin-left:-56px;transform-origin:50% 170%;transition:.18s ease;cursor:pointer;pointer-events:auto}.handCard.selected{bottom:94px!important;filter:drop-shadow(0 0 12px #ffd84d);z-index:100!important}.yourTurnGlow{position:absolute;z-index:5;left:50%;bottom:0;transform:translateX(-50%);width:78%;height:245px;border-radius:50% 50% 0 0;box-shadow:inset 0 -25px 80px #ffd84d55;pointer-events:none;opacity:0;transition:.2s}.yourTurnGlow.show{opacity:1;animation:glowPulse .8s infinite alternate}.playBtn{right:22px;bottom:24px;width:150px;padding:14px;border-radius:18px;background:#6d4b38dd;color:#fff;font-size:18px}.playBtn.ready{background:#ffd84de8;color:#1b130d;box-shadow:0 0 20px #ffd84d99}.turnSplash,.winOverlay{position:absolute;z-index:80;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.turnSplash>div{background:#ffd84df2;color:#17110c;padding:18px 34px;border-radius:24px;font-size:30px;font-weight:900;box-shadow:0 0 45px #ffd84dcc;animation:splash .9s forwards}.winOverlay{background:#090603cc;pointer-events:auto;flex-direction:column}.winCard{background:#211711f5;border:1px solid #ffffff30;border-radius:28px;padding:28px 34px;min-width:360px;box-shadow:0 18px 70px #000}.trophy{font-size:62px}.winTitle{font-size:34px;font-weight:900;color:#ffd84d}.loseTitle{font-size:30px;font-weight:900}.winSub{font-size:18px;color:#ddd;margin:10px 0 18px}.confetti{position:absolute;width:10px;height:18px;top:-30px;animation:fall linear forwards}.rematchBtn{background:#ffd84d;color:#1b130d;font-size:19px}.waitingRematch{color:#ddd;background:#ffffff12;padding:12px;border-radius:12px}.toast{position:absolute;z-index:50;left:50%;top:115px;transform:translateX(-50%);background:#15100ddd;padding:8px 14px;border-radius:11px}.hide{display:none!important}@keyframes turnPulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.06)}}@keyframes avatarPulse{to{transform:scale(1.08)}}@keyframes glowPulse{to{box-shadow:inset 0 -35px 110px #ffd84d88}}@keyframes splash{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.08)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-width:900px){.card{width:90px;height:132px;font-size:46px;border-width:6px}.handCard{margin-left:-45px}.deck{width:90px;height:132px}.center{gap:22px}#hand{width:620px;height:260px}.opp{width:105px}.avatar{width:50px;height:50px}.playBtn{width:125px;font-size:15px}.winCard{min-width:300px}}</style></head><body><div id="home" class="home"><div class="logo">COLOR CLASH</div><div class="sub">LAN CARD GAME</div><div class="panel"><div id="joinHint" class="joinHint hide"></div><input id="name" placeholder="اسم اللاعب"><div id="normalJoin"><button onclick="createRoom()">إنشاء لعبة</button><input id="roomInput" placeholder="رمز الغرفة" maxlength="5"><button class="secondary" onclick="joinRoom()">دخول الغرفة</button></div><button id="quickJoin" class="hide" onclick="joinRoom()">دخول الغرفة مباشرة</button><div id="homeMsg"></div></div></div><div id="lobby" class="home hide"><div class="logo">COLOR CLASH</div><div class="panel"><div>رمز الغرفة</div><div id="roomCode" style="font-size:34px;font-weight:900;color:#ffd84d;letter-spacing:5px"></div><div id="lobbyPlayers"></div><div class="roomTools"><button class="secondary" onclick="copyInvite()">نسخ رابط الدعوة</button><button class="secondary" onclick="shareInvite()">مشاركة</button></div><button id="startBtn" class="hide" onclick="action('/api/start')">ابدأ اللعبة</button></div></div><div id="board" class="table hide"><button class="menuBtn">☰</button><button class="chatBtn">💬</button><div class="roomBadge">📶 الغرفة <span id="roomMini"></span></div><div id="turnBanner" class="turnBanner"></div><div id="opponents" class="opponents"></div><div id="toast" class="toast hide"></div><div class="center"><div class="deck" onclick="action('/api/draw')"></div><div id="top"></div></div><div id="yourTurnGlow" class="yourTurnGlow"></div><div id="hand"></div><button id="playBtn" class="playBtn" onclick="playSelected()">اختر بطاقة</button><div id="turnSplash" class="turnSplash hide"><div>دورك الآن!</div></div><div id="winOverlay" class="winOverlay hide"><div id="confettiLayer"></div><div class="winCard"><div id="trophy" class="trophy">🏆</div><div id="winTitle" class="winTitle"></div><div id="winSub" class="winSub"></div><button id="rematchBtn" class="rematchBtn hide" onclick="action('/api/restart')">العب مرة أخرى</button><div id="waitingRematch" class="waitingRematch hide">بانتظار المضيف لبدء جولة جديدة…</div></div></div></div><script>let room='',pid='',timer,selected=-1,lastTurnPlayer='',lastWinner=null;const $=id=>document.getElementById(id);function enc(o){return Object.entries(o).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:enc(data)});return r.json()}function savedName(){return localStorage.getItem('cc_name')||''}function saveName(){let n=$('name').value.trim();if(n)localStorage.setItem('cc_name',n)}function inviteRoom(){return new URLSearchParams(location.search).get('room')||''}function init(){ $('name').value=savedName();let q=inviteRoom().toUpperCase();if(q){$('roomInput').value=q;$('joinHint').classList.remove('hide');$('joinHint').textContent='دعوة للانضمام إلى الغرفة '+q;$('normalJoin').classList.add('hide');$('quickJoin').classList.remove('hide')}}async function createRoom(){saveName();enter(await post('/api/create',{name:$('name').value}))}async function joinRoom(){saveName();enter(await post('/api/join',{name:$('name').value,room:$('roomInput').value||inviteRoom()}))}function enter(j){if(!j.ok){$('homeMsg').textContent=j.error;return}room=j.room;pid=j.playerId;history.replaceState(null,'','/?room='+room);$('home').classList.add('hide');$('lobby').classList.remove('hide');$('roomCode').textContent=room;$('roomMini').textContent=room;poll();clearInterval(timer);timer=setInterval(poll,650)}async function action(path,extra={}){let j=await post(path,{room,playerId:pid,...extra});if(!j.ok)showToast(j.error);else selected=-1;poll()}function showToast(t){let x=$('toast');x.textContent=t;x.classList.remove('hide');setTimeout(()=>x.classList.add('hide'),1700)}function inviteUrl(){return location.origin+'/?room='+room}async function copyInvite(){try{await navigator.clipboard.writeText(inviteUrl());showToast('تم نسخ رابط الدعوة')}catch(e){prompt('انسخ الرابط',inviteUrl())}}function shareInvite(){if(navigator.share)navigator.share({title:'Color Clash',text:'انضم إلى الغرفة '+room,url:inviteUrl()});else copyInvite()}async function poll(){if(!room)return;let j=await fetch('/api/status?'+enc({room,playerId:pid})).then(r=>r.json());if(!j.ok)return;$('lobbyPlayers').innerHTML=j.players.map(p=>`<div style="padding:6px">${p.you?'أنت — ':''}${p.name}</div>`).join('');$('startBtn').classList.toggle('hide',!j.isHost||j.started||j.winner);if(j.started){$('lobby').classList.add('hide');$('board').classList.remove('hide')}if(j.winner){showWinner(j);return}else{$('winOverlay').classList.add('hide');lastWinner=null}if(!j.started)return;let current=j.players.find(p=>p.turn),me=j.players.find(p=>p.you);let curName=current?current.name:'—';$('turnBanner').textContent=(me&&me.turn)?'دورك الآن':'دور '+curName;$('turnBanner').classList.toggle('you',!!(me&&me.turn));$('yourTurnGlow').classList.toggle('show',!!(me&&me.turn));if(current&&lastTurnPlayer!==current.name){if(me&&me.turn){$('turnSplash').classList.remove('hide');setTimeout(()=>$('turnSplash').classList.add('hide'),950);if(navigator.vibrate)navigator.vibrate([120,70,120])}lastTurnPlayer=current.name}$('opponents').innerHTML=renderOpponents(j.players.filter(p=>!p.you));$('top').innerHTML=card(j.top,-1,false);renderHand(j.hand);updatePlayButton()}function renderOpponents(arr){let pos=['top','left','right','extra1','extra2'];return arr.slice(0,5).map((p,i)=>`<div class="opp ${pos[i]} ${p.turn?'active':''}"><div class="avatar"></div><div class="nameTag">${p.name}</div><div class="miniCards"><i class="back"></i><i class="back"></i><i class="back"></i></div><div class="countTag">${p.count}</div></div>`).join('')}function label(v){return({skip:'⊘',reverse:'↔',draw2:'+2',wild:'WILD',wild4:'+4'})[v]||v}function card(c,i,isHand){if(!c)return'';let cl=c.color||'wild',v=label(c.value),act=isNaN(Number(c.value))?' action':'',sel=i===selected?' selected':'';return `<div class="card ${cl}${act}${isHand?' handCard':''}${sel}" ${isHand?`onclick="selectCard(${i})"`:''}><span class="corner tl">${v}</span><span class="big">${v}</span><span class="corner br">${v}</span></div>`}function renderHand(cards){let n=cards.length,spread=Math.min(72,Math.max(24,n*8)),step=n>1?spread/(n-1):0,start=-spread/2;$('hand').innerHTML=cards.map((c,i)=>{let a=start+i*step,x=(i-(n-1)/2)*Math.min(46,360/Math.max(1,n-1)),y=Math.abs(a)*.45;return card(c,i,true).replace('class="card','style="transform:translate('+x+'px,'+y+'px) rotate('+a+'deg);z-index:'+(i+1)+'" class="card')}).join('')}function selectCard(i){selected=i;poll()}function updatePlayButton(){let b=$('playBtn');if(selected>=0){b.textContent='العب البطاقة';b.classList.add('ready')}else{b.textContent='اختر بطاقة';b.classList.remove('ready')}}async function playSelected(){if(selected<0)return showToast('اختر بطاقة أولًا');let st=await fetch('/api/status?'+enc({room,playerId:pid})).then(r=>r.json()),c=st.hand[selected];if(!c)return;if(c.color===null){let col=prompt('اختر اللون: red / yellow / green / blue','red');if(!['red','yellow','green','blue'].includes(col))return;action('/api/play',{cardIndex:selected,color:col})}else action('/api/play',{cardIndex:selected})}function showWinner(j){if(lastWinner===j.winner)return;lastWinner=j.winner;$('board').classList.remove('hide');$('winOverlay').classList.remove('hide');let me=j.players.find(p=>p.you),won=me&&me.name===j.winner;$('trophy').textContent=won?'🏆':'🎉';$('winTitle').textContent=won?'مبروك! لقد فزت':'الفائز: '+j.winner;$('winSub').textContent=won?'أحسنت! جولة ممتازة.':'حظ أوفر في المرة القادمة';$('rematchBtn').classList.toggle('hide',!j.isHost);$('waitingRematch').classList.toggle('hide',j.isHost);makeConfetti()}function makeConfetti(){let l=$('confettiLayer');l.innerHTML='';let colors=['#ffd400','#ed1c24','#079447','#087ac1','#fff'];for(let i=0;i<70;i++){let s=document.createElement('i');s.className='confetti';s.style.left=Math.random()*100+'%';s.style.background=colors[i%colors.length];s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.7)+'s';l.appendChild(s)}}init();</script></body></html>
