<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Color Clash</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#17110c;color:#fff;font-family:Arial,sans-serif}body{text-align:center}.hide{display:none!important}.home{max-width:520px;margin:0 auto;padding:22px;min-height:100dvh;overflow:auto}.logo{font-size:clamp(30px,8vw,40px);font-weight:900}.sub{color:#ffd84d;font-weight:800;margin-bottom:18px}.panel{background:#1d2028;border-radius:22px;padding:18px;box-shadow:0 10px 30px #0008}input,button{width:100%;padding:14px;border:0;border-radius:13px;margin:6px 0;font-size:17px}button{background:#ffd84d;color:#17110c;font-weight:900;cursor:pointer}.secondary{background:#343a46;color:#fff}.joinHint{background:#161a22;padding:10px;border-radius:12px;margin:8px 0;color:#dfe6ef}.roomTools{display:flex;gap:8px;margin-top:8px}.roomTools button{font-size:14px;padding:10px}.table{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100svh;overflow:hidden;background:radial-gradient(circle at 50% 45%,#ad6b36 0,#8b4e27 42%,#633518 78%,#4d2915 100%);touch-action:manipulation}.table:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.11;background:repeating-linear-gradient(2deg,transparent 0 23px,#fff 24px 25px,transparent 26px 48px)}.roomBadge,.turnBanner{position:absolute;z-index:20;background:#211711df;color:#fff;border:1px solid #ffffff28;box-shadow:0 5px 14px #0006}.roomBadge{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));padding:8px 12px;border-radius:14px;font-size:clamp(11px,2.4vw,15px);font-weight:800}.turnBanner{top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:16px;font-size:clamp(14px,3vw,19px);font-weight:900;min-width:150px;max-width:48vw}.turnBanner.you{background:#ffd84de8;color:#1a130c;box-shadow:0 0 0 3px #fff4,0 0 24px #ffd84daa;animation:turnPulse 1s infinite alternate}.opponents{position:absolute;z-index:7;inset:0;pointer-events:none}.opp{position:absolute;width:clamp(78px,14vw,118px);text-align:center;transition:.2s}.opp.top{top:clamp(42px,8vh,62px);left:50%;transform:translateX(-50%)}.opp.left{left:max(6px,env(safe-area-inset-left));top:48%;transform:translateY(-50%)}.opp.right{right:max(6px,env(safe-area-inset-right));top:48%;transform:translateY(-50%)}.opp.extra1{top:clamp(48px,9vh,68px);left:23%}.opp.extra2{top:clamp(48px,9vh,68px);right:23%}.avatar{width:clamp(38px,7vw,56px);height:clamp(38px,7vw,56px);border-radius:50%;margin:auto;background:linear-gradient(#d8e7ef,#7892a3);border:3px solid #c8d4dc;position:relative}.opp.active .avatar{border-color:#ffd84d;box-shadow:0 0 0 4px #ffd84d55,0 0 22px #ffd84d;animation:avatarPulse .7s infinite alternate}.opp.active .avatar:after{content:"▼";position:absolute;top:-24px;left:50%;transform:translateX(-50%);color:#ffd84d;font-size:18px;text-shadow:0 2px 5px #000}.nameTag{display:inline-block;margin-top:2px;background:#241710e8;border-radius:9px;padding:3px 8px;font-size:clamp(10px,2vw,14px);font-weight:900;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.countTag{display:inline-block;margin-top:2px;background:#15100de8;border-radius:8px;padding:2px 7px;font-size:clamp(10px,2vw,13px);font-weight:800}.miniCards{position:relative;height:32px;width:68px;margin:2px auto}.back{position:absolute;width:23px;height:32px;border:2px solid #eee;border-radius:4px;background:radial-gradient(ellipse,#e3332c 0 34%,#151515 36% 100%);box-shadow:0 2px 4px #0008}.back:nth-child(1){left:10px;transform:rotate(-14deg)}.back:nth-child(2){left:23px}.back:nth-child(3){left:36px;transform:rotate(14deg)}.center{position:absolute;z-index:8;top:45%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:clamp(12px,3vw,30px)}.deck{width:clamp(70px,12vw,100px);height:clamp(104px,18vw,146px);border-radius:12px;border:6px solid #eee;background:radial-gradient(ellipse,#e3332c 0 34%,#151515 36% 100%);box-shadow:0 8px 18px #0009;cursor:pointer;position:relative}.deck:after{content:"اسحب";position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:11px;background:#24170ee8;padding:4px 8px;border-radius:7px;white-space:nowrap}.card{--card:#222;position:relative;width:clamp(70px,12vw,100px);height:clamp(104px,18vw,146px);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(36px,7vw,52px);border:6px solid #f7f3e9;box-shadow:0 6px 13px #0009,inset 0 0 0 2px #0003;background:var(--card);color:var(--card);overflow:hidden;text-shadow:-2px -2px 0 #111,2px -2px 0 #111,-2px 2px 0 #111,2px 2px 0 #111}.card:before{content:"";position:absolute;width:78%;height:76%;background:#f3efe5;border-radius:52% 30% 52% 30%;transform:rotate(-10deg);box-shadow:inset 0 0 8px #0002}.card .big{position:relative;z-index:2}.card .corner{position:absolute;z-index:3;font-size:clamp(12px,2.4vw,17px);color:#fff;text-shadow:-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111,1px 1px 0 #111}.tl{top:6px;left:6px}.br{bottom:6px;right:6px;transform:rotate(180deg)}.red{--card:#ed1c24}.yellow{--card:#ffd400}.green{--card:#079447}.blue{--card:#087ac1}.wild{--card:#171717;background:#171717}.wild:before{background:conic-gradient(#079447 0 25%,#ed1c24 0 50%,#087ac1 0 75%,#ffd400 0);border-radius:50%;width:67%;height:45%}.wild .big{font-size:clamp(17px,3vw,23px);color:#fff}.action .big{font-size:clamp(27px,5vw,36px);color:var(--card)}#hand{position:absolute;z-index:12;left:50%;bottom:-18px;width:min(86vw,700px);height:min(42vh,270px);transform:translateX(-50%);pointer-events:none}.handCard{position:absolute;left:50%;bottom:44px;margin-left:calc(clamp(70px,12vw,100px)/-2);transform-origin:50% 175%;transition:.16s ease;cursor:pointer;pointer-events:auto}.handCard:active{filter:brightness(1.12) drop-shadow(0 0 12px #ffd84d);z-index:100!important}.yourTurnGlow{position:absolute;z-index:5;left:50%;bottom:0;transform:translateX(-50%);width:76%;height:32vh;border-radius:50% 50% 0 0;box-shadow:inset 0 -25px 80px #ffd84d55;pointer-events:none;opacity:0}.yourTurnGlow.show{opacity:1;animation:glowPulse .8s infinite alternate}.turnSplash,.winOverlay{position:absolute;z-index:80;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.turnSplash>div{background:#ffd84df2;color:#17110c;padding:14px 28px;border-radius:22px;font-size:clamp(22px,5vw,30px);font-weight:900;box-shadow:0 0 45px #ffd84dcc;animation:splash .9s forwards}.winOverlay{background:#090603cc;pointer-events:auto;flex-direction:column;padding:16px}.winCard{background:#211711f5;border:1px solid #ffffff30;border-radius:24px;padding:22px 26px;width:min(86vw,380px);max-height:86dvh;overflow:auto;box-shadow:0 18px 70px #000}.trophy{font-size:52px}.winTitle{font-size:clamp(25px,5vw,34px);font-weight:900;color:#ffd84d}.loseTitle{font-size:28px;font-weight:900}.winSub{font-size:16px;color:#ddd;margin:9px 0 15px}.confetti{position:absolute;width:10px;height:18px;top:-30px;animation:fall linear forwards}.rematchBtn{background:#ffd84d;color:#1b130d;font-size:18px}.waitingRematch{color:#ddd;background:#ffffff12;padding:10px;border-radius:12px}.toast{position:absolute;z-index:50;left:50%;top:16%;transform:translateX(-50%);background:#15100ddd;padding:8px 14px;border-radius:11px;max-width:70vw}.hide{display:none!important}@keyframes turnPulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.05)}}@keyframes avatarPulse{to{transform:scale(1.07)}}@keyframes glowPulse{to{box-shadow:inset 0 -35px 100px #ffd84d88}}@keyframes splash{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.08)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}@keyframes fall{to{transform:translateY(110dvh) rotate(720deg)}}@media (orientation:portrait){.opp.top{top:72px}.opp.left{left:5px;top:36%}.opp.right{right:5px;top:36%}.opp.extra1{top:130px;left:14%}.opp.extra2{top:130px;right:14%}.center{top:45%}#hand{width:94vw;height:34vh;bottom:-8px}.handCard{bottom:36px}.roomBadge{top:50px}.turnBanner{top:8px;max-width:70vw}.card,.deck{width:72px;height:106px}.card{font-size:36px}.handCard{margin-left:-36px}.winCard{width:90vw}}@media (max-height:500px) and (orientation:landscape){.opp.top{top:36px}.opp.left,.opp.right{top:43%}.opp.extra1,.opp.extra2{top:40px}.avatar{width:38px;height:38px}.miniCards{height:25px}.back{width:19px;height:27px}.back:nth-child(1){left:12px}.back:nth-child(2){left:22px}.back:nth-child(3){left:32px}.nameTag,.countTag{font-size:10px}.center{top:43%}.card,.deck{width:72px;height:106px}.card{font-size:36px}.handCard{margin-left:-36px;bottom:35px}#hand{height:180px;bottom:-20px}.yourTurnGlow{height:150px}.roomBadge{padding:6px 9px}.turnBanner{padding:6px 12px;font-size:14px}.winCard{padding:16px 20px}.trophy{font-size:42px}}</style></head><body><div id="home" class="home"><div class="logo">COLOR CLASH</div><div class="sub">LAN CARD GAME</div><div class="panel"><div id="joinHint" class="joinHint hide"></div><input id="name" placeholder="اسم اللاعب"><div id="normalJoin"><button onclick="createRoom()">إنشاء لعبة</button><input id="roomInput" placeholder="رمز الغرفة" maxlength="5"><button class="secondary" onclick="joinRoom()">دخول الغرفة</button></div><button id="quickJoin" class="hide" onclick="joinRoom()">دخول الغرفة مباشرة</button><div id="homeMsg"></div></div></div><div id="lobby" class="home hide"><div class="logo">COLOR CLASH</div><div class="panel"><div>رمز الغرفة</div><div id="roomCode" style="font-size:34px;font-weight:900;color:#ffd84d;letter-spacing:5px"></div><div id="lobbyPlayers"></div><div class="roomTools"><button class="secondary" onclick="copyInvite()">نسخ رابط الدعوة</button><button class="secondary" onclick="shareInvite()">مشاركة</button></div><button id="startBtn" class="hide" onclick="action('/api/start')">ابدأ اللعبة</button></div></div><div id="board" class="table hide"><div class="roomBadge">📶 <span id="roomMini"></span></div><div id="turnBanner" class="turnBanner"></div><div id="opponents" class="opponents"></div><div id="toast" class="toast hide"></div><div class="center"><div class="deck" onclick="action('/api/draw')"></div><div id="top"></div></div><div id="yourTurnGlow" class="yourTurnGlow"></div><div id="hand"></div><div id="turnSplash" class="turnSplash hide"><div>دورك الآن!</div></div><div id="winOverlay" class="winOverlay hide"><div id="confettiLayer"></div><div class="winCard"><div id="trophy" class="trophy">🏆</div><div id="winTitle" class="winTitle"></div><div id="winSub" class="winSub"></div><button id="rematchBtn" class="rematchBtn hide" onclick="action('/api/restart')">العب مرة أخرى</button><div id="waitingRematch" class="waitingRematch hide">بانتظار المضيف لبدء جولة جديدة…</div></div></div></div><script>let room='',pid='',timer,lastTurnPlayer='',lastWinner=null;const $=id=>document.getElementById(id);function enc(o){return Object.entries(o).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:enc(data)});return r.json()}function savedName(){return localStorage.getItem('cc_name')||''}function saveName(){let n=$('name').value.trim();if(n)localStorage.setItem('cc_name',n)}function inviteRoom(){return new URLSearchParams(location.search).get('room')||''}function init(){$('name').value=savedName();let q=inviteRoom().toUpperCase();if(q){$('roomInput').value=q;$('joinHint').classList.remove('hide');$('joinHint').textContent='دعوة للانضمام إلى الغرفة '+q;$('normalJoin').classList.add('hide');$('quickJoin').classList.remove('hide')}}async function createRoom(){saveName();enter(await post('/api/create',{name:$('name').value}))}async function joinRoom(){saveName();enter(await post('/api/join',{name:$('name').value,room:$('roomInput').value||inviteRoom()}))}function enter(j){if(!j.ok){$('homeMsg').textContent=j.error;return}room=j.room;pid=j.playerId;history.replaceState(null,'','/?room='+room);$('home').classList.add('hide');$('lobby').classList.remove('hide');$('roomCode').textContent=room;$('roomMini').textContent=room;poll();clearInterval(timer);timer=setInterval(poll,650)}async function action(path,extra={}){let j=await post(path,{room,playerId:pid,...extra});if(!j.ok)showToast(j.error);poll()}function showToast(t){let x=$('toast');x.textContent=t;x.classList.remove('hide');setTimeout(()=>x.classList.add('hide'),1700)}function inviteUrl(){return location.origin+'/?room='+room}async function copyInvite(){try{await navigator.clipboard.writeText(inviteUrl());showToast('تم نسخ رابط الدعوة')}catch(e){prompt('انسخ الرابط',inviteUrl())}}function shareInvite(){if(navigator.share)navigator.share({title:'Color Clash',text:'انضم إلى الغرفة '+room,url:inviteUrl()});else copyInvite()}async function poll(){if(!room)return;let j=await fetch('/api/status?'+enc({room,playerId:pid})).then(r=>r.json());if(!j.ok)return;$('lobbyPlayers').innerHTML=j.players.map(p=>`<div style="padding:6px">${p.you?'أنت — ':''}${p.name}</div>`).join('');$('startBtn').classList.toggle('hide',!j.isHost||j.started||j.winner);if(j.started){$('lobby').classList.add('hide');$('board').classList.remove('hide')}if(j.winner){showWinner(j);return}else{$('winOverlay').classList.add('hide');lastWinner=null}if(!j.started)return;let current=j.players.find(p=>p.turn),me=j.players.find(p=>p.you);let curName=current?current.name:'—';$('turnBanner').textContent=(me&&me.turn)?'دورك الآن':'دور '+curName;$('turnBanner').classList.toggle('you',!!(me&&me.turn));$('yourTurnGlow').classList.toggle('show',!!(me&&me.turn));if(current&&lastTurnPlayer!==current.name){if(me&&me.turn){$('turnSplash').classList.remove('hide');setTimeout(()=>$('turnSplash').classList.add('hide'),950);if(navigator.vibrate)navigator.vibrate([120,70,120])}lastTurnPlayer=current.name}$('opponents').innerHTML=renderOpponents(j.players.filter(p=>!p.you));$('top').innerHTML=card(j.top,-1,false);renderHand(j.hand)}function renderOpponents(arr){let pos=['top','left','right','extra1','extra2'];return arr.slice(0,5).map((p,i)=>`<div class="opp ${pos[i]} ${p.turn?'active':''}"><div class="avatar"></div><div class="nameTag">${p.name}</div><div class="miniCards"><i class="back"></i><i class="back"></i><i class="back"></i></div><div class="countTag">${p.count}</div></div>`).join('')}function label(v){return({skip:'⊘',reverse:'↔',draw2:'+2',wild:'WILD',wild4:'+4'})[v]||v}function card(c,i,isHand){if(!c)return'';let cl=c.color||'wild',v=label(c.value),act=isNaN(Number(c.value))?' action':'';return `<div class="card ${cl}${act}${isHand?' handCard':''}" ${isHand?`onclick="playCard(${i})"`:''}><span class="corner tl">${v}</span><span class="big">${v}</span><span class="corner br">${v}</span></div>`}function renderHand(cards){let n=cards.length,spread=Math.min(68,Math.max(20,n*7)),step=n>1?spread/(n-1):0,start=-spread/2,avail=Math.min(window.innerWidth*.62,430),dx=n>1?Math.min(44,avail/(n-1)):0;$('hand').innerHTML=cards.map((c,i)=>{let a=start+i*step,x=(i-(n-1)/2)*dx,y=Math.abs(a)*.38;return card(c,i,true).replace('class="card','style="transform:translate('+x+'px,'+y+'px) rotate('+a+'deg);z-index:'+(i+1)+'" class="card')}).join('')}async function playCard(i){let st=await fetch('/api/status?'+enc({room,playerId:pid})).then(r=>r.json());let me=st.players&&st.players.find(p=>p.you);if(!me||!me.turn)return showToast('انتظر دورك');let c=st.hand&&st.hand[i];if(!c)return;if(c.color===null){let col=prompt('اختر اللون: red / yellow / green / blue','red');if(!['red','yellow','green','blue'].includes(col))return;action('/api/play',{cardIndex:i,color:col})}else action('/api/play',{cardIndex:i})}function showWinner(j){if(lastWinner===j.winner)return;lastWinner=j.winner;$('board').classList.remove('hide');$('winOverlay').classList.remove('hide');let me=j.players.find(p=>p.you),won=me&&me.name===j.winner;$('trophy').textContent=won?'🏆':'🎉';$('winTitle').textContent=won?'مبروك! لقد فزت':'الفائز: '+j.winner;$('winSub').textContent=won?'أحسنت! جولة ممتازة.':'حظ أوفر في المرة القادمة';$('rematchBtn').classList.toggle('hide',!j.isHost);$('waitingRematch').classList.toggle('hide',j.isHost);makeConfetti()}function makeConfetti(){let l=$('confettiLayer');l.innerHTML='';let colors=['#ffd400','#ed1c24','#079447','#087ac1','#fff'];for(let i=0;i<70;i++){let s=document.createElement('i');s.className='confetti';s.style.left=Math.random()*100+'%';s.style.background=colors[i%colors.length];s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.7)+'s';l.appendChild(s)}}window.addEventListener('resize',()=>{if(room)poll()});init();</script></body></html>
