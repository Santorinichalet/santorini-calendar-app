<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Clash</title><style>*{box-sizing:border-box}body{margin:0;background:#10131a;color:#fff;font-family:Arial,sans-serif;text-align:center}.wrap{max-width:760px;margin:auto;padding:16px}h1{font-size:34px;margin:12px 0 2px}.sub{color:#ffd54a;font-weight:bold}.panel{background:#1b202b;border-radius:22px;padding:18px;margin:16px 0}input,button{width:100%;padding:15px;border:0;border-radius:13px;margin:6px 0;font-size:17px}button{background:#ffd54a;color:#111;font-weight:bold}.secondary{background:#303847;color:#fff}.hide{display:none}.code{font-size:30px;letter-spacing:5px;color:#ffd54a;font-weight:bold}.players{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.player{background:#292f3b;padding:8px 11px;border-radius:12px}.turn{outline:3px solid #ffd54a}.small{font-size:13px;color:#d9d9d9}.gameTable{position:relative;min-height:690px;margin-top:12px;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#9b5c2d 0,#7c431f 45%,#5b2f16 100%);box-shadow:inset 0 0 50px #0008,0 8px 24px #0008}.gameTable:before{content:"";position:absolute;inset:0;opacity:.14;background:repeating-linear-gradient(5deg,#fff0 0 24px,#fff3 25px 27px,#0000 28px 52px)}.topbar{position:absolute;z-index:10;top:12px;right:12px;background:#18120ed9;padding:10px 13px;border-radius:14px;font-weight:bold}.turnText{position:absolute;z-index:10;top:14px;left:50%;transform:translateX(-50%);background:#18120ed9;padding:9px 15px;border-radius:18px;font-weight:bold}.opponents{position:absolute;z-index:5;top:60px;left:14px;right:14px;display:flex;justify-content:space-around;gap:8px}.opp{min-width:86px;background:#17120dd9;border-radius:16px;padding:7px}.avatar{width:42px;height:42px;border-radius:50%;margin:auto;background:linear-gradient(#d7e7f5,#8fa8ba);border:3px solid #fff}.opp.turning{box-shadow:0 0 0 3px #ffd54a}.miniCards{height:34px;position:relative;margin-top:5px}.back{position:absolute;width:27px;height:38px;border:3px solid #eee;border-radius:5px;background:radial-gradient(ellipse,#e5332a 0 34%,#111 36% 100%);box-shadow:0 2px 5px #0007}.miniCards .back:nth-child(1){left:21px;transform:rotate(-14deg)}.miniCards .back:nth-child(2){left:31px}.miniCards .back:nth-child(3){left:41px;transform:rotate(14deg)}.centerArea{position:absolute;z-index:5;top:225px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:22px}.deck{width:92px;height:136px;border-radius:12px;border:7px solid #eee;background:radial-gradient(ellipse,#e3322b 0 34%,#121212 36% 100%);box-shadow:0 8px 14px #0008;cursor:pointer}.drawLabel{position:absolute;top:368px;left:50%;transform:translateX(-50%);z-index:8;background:#22170ed9;border:1px solid #ffffff33;border-radius:15px;padding:8px 18px;font-size:14px}.card{--card:#222;position:relative;width:94px;height:142px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:47px;border:7px solid #f7f3e9;box-shadow:0 5px 11px #0009,inset 0 0 0 2px #0003;background:var(--card);color:var(--card);overflow:hidden;text-shadow:-2px -2px 0 #111,2px -2px 0 #111,-2px 2px 0 #111,2px 2px 0 #111}.card:before{content:"";position:absolute;width:78%;height:76%;background:#f3efe5;border-radius:52% 30% 52% 30%;transform:rotate(-10deg);box-shadow:inset 0 0 8px #0002}.card .big{position:relative;z-index:2;line-height:1}.card .corner{position:absolute;z-index:3;font-size:17px;line-height:1;color:#fff;text-shadow:-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111,1px 1px 0 #111}.card .tl{top:7px;left:7px}.card .br{bottom:7px;right:7px;transform:rotate(180deg)}.red{--card:#ed1c24}.yellow{--card:#ffd400}.green{--card:#079447}.blue{--card:#087ac1}.wild{--card:#171717;background:#171717}.wild:before{background:conic-gradient(#079447 0 25%,#ed1c24 0 50%,#087ac1 0 75%,#ffd400 0);border-radius:50%;width:67%;height:45%;transform:rotate(-12deg)}.wild .big{font-size:24px;color:#fff}.action .big{font-size:34px;color:var(--card)}#handWrap{position:absolute;z-index:7;left:0;right:0;bottom:0;height:310px;overflow:hidden;pointer-events:none}#hand{position:absolute;left:50%;bottom:18px;width:460px;height:235px;transform:translateX(-50%);pointer-events:auto}#hand .card{position:absolute;left:50%;bottom:58px;margin-left:-47px;transform-origin:50% 145%;transition:.18s ease;cursor:pointer}#hand .card:hover,#hand .card:active{bottom:78px;z-index:30!important}#handWrap:before{content:"";position:absolute;z-index:18;left:50%;bottom:-50px;width:190px;height:150px;border-radius:50% 50% 42% 42%;background:linear-gradient(145deg,#d99d77,#b66f4f);transform:translateX(-52%) rotate(-5deg);box-shadow:inset -15px -10px 18px #7a3f2e55,0 8px 14px #0006}#handWrap:after{content:"";position:absolute;z-index:19;left:50%;bottom:42px;width:86px;height:34px;border-radius:28px;background:linear-gradient(#dea47f,#b96f4d);transform:translateX(-12%) rotate(-28deg);box-shadow:0 3px 7px #0005}.restart{position:absolute;z-index:20;bottom:12px;right:12px;width:120px}.msg{position:absolute;z-index:12;top:190px;left:50%;transform:translateX(-50%);background:#111b;padding:6px 12px;border-radius:12px;max-width:80%}@media(max-width:520px){.gameTable{min-height:650px}.opponents{top:58px}.centerArea{top:215px}.card{width:82px;height:124px;font-size:41px;border-width:6px}.card .corner{font-size:15px}#hand{width:390px;height:220px}#hand .card{margin-left:-41px;bottom:56px}.deck{width:82px;height:124px}.centerArea{gap:14px}}
</style></head><body><div class="wrap"><h1>COLOR CLASH</h1><div class="sub">LAN CARD GAME</div><div id="home" class="panel"><input id="name" placeholder="اسم اللاعب"><button onclick="createRoom()">إنشاء لعبة</button><input id="roomInput" placeholder="رمز الغرفة" maxlength="5"><button class="secondary" onclick="joinRoom()">دخول الغرفة</button><div id="homeMsg"></div></div><div id="game" class="hide"><div class="panel" id="lobby"><div>رمز الغرفة</div><div id="roomCode" class="code"></div><div id="players" class="players"></div><button id="startBtn" class="hide" onclick="action('/api/start')">ابدأ اللعبة</button></div><div id="board" class="gameTable hide"><div class="topbar">الغرفة <span id="roomMini"></span></div><div id="turnText" class="turnText"></div><div id="opponents" class="opponents"></div><div id="msg" class="msg"></div><div class="centerArea"><div class="deck" onclick="action('/api/draw')"></div><div id="top"></div></div><div class="drawLabel">اضغط على الرزمة لسحب بطاقة</div><div id="handWrap"><div id="hand"></div></div><button id="restart" class="restart hide" onclick="action('/api/restart')">لعبة جديدة</button></div></div></div><script>let room='',pid='',timer;const $=id=>document.getElementById(id);function enc(o){return Object.entries(o).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:enc(data)});return r.json()}async function createRoom(){enter(await post('/api/create',{name:$('name').value}))}async function joinRoom(){enter(await post('/api/join',{name:$('name').value,room:$('roomInput').value}))}function enter(j){if(!j.ok){$('homeMsg').textContent=j.error;return}room=j.room;pid=j.playerId;$('home').classList.add('hide');$('game').classList.remove('hide');$('roomCode').textContent=room;$('roomMini').textContent=room;poll();timer=setInterval(poll,900)}async function action(path,extra={}){let j=await post(path,{room,playerId:pid,...extra});$('msg').textContent=j.ok?'':j.error;poll()}async function poll(){if(!room)return;let j=await fetch('/api/status?'+enc({room,playerId:pid})).then(r=>r.json());if(!j.ok)return;$('players').innerHTML=j.players.map(p=>`<span class="player ${p.turn?'turn':''}">${p.you?'أنت: ':''}${p.name} (${p.count})</span>`).join('');$('startBtn').classList.toggle('hide',!j.isHost||j.started||j.winner);$('board').classList.toggle('hide',!j.started);$('lobby').classList.toggle('hide',j.started);$('restart').classList.toggle('hide',!j.winner||!j.isHost);$('opponents').innerHTML=j.players.filter(p=>!p.you).slice(0,5).map(p=>`<div class="opp ${p.turn?'turning':''}"><div class="avatar"></div><b>${p.name}</b><div class="miniCards"><i class="back"></i><i class="back"></i><i class="back"></i></div><span>${p.count} بطاقات</span></div>`).join('');if(j.winner){$('msg').textContent='الفائز: '+j.winner;return}if(!j.started)return;let me=j.players.find(p=>p.you);$('turnText').textContent=me&&me.turn?'دورك الآن':'انتظر دورك';$('top').innerHTML=card(j.top,-1);renderHand(j.hand)}function label(v){return({skip:'⊘',reverse:'↔',draw2:'+2',wild:'WILD',wild4:'+4'})[v]||v}function card(c,i){if(!c)return'';let cl=c.color||'wild',v=label(c.value),act=isNaN(Number(c.value))?' action':'';return `<div class="card ${cl}${act}" ${i>=0?`onclick="play(${i},${c.color===null})"`:''}><span class="corner tl">${v}</span><span class="big">${v}</span><span class="corner br">${v}</span></div>`}function renderHand(cards){let n=cards.length,spread=Math.min(72,Math.max(28,n*8)),step=n>1?spread/(n-1):0,start=-spread/2;$('hand').innerHTML=cards.map((c,i)=>{let a=start+i*step,x=(i-(n-1)/2)*Math.min(31,260/Math.max(1,n-1)),y=Math.abs(a)*.48;return card(c,i).replace('class="card','style="transform:translate('+x+'px,'+y+'px) rotate('+a+'deg);z-index:'+(i+1)+'" class="card')}).join('')}function play(i,wild){if(wild){let c=prompt('اختر اللون: red / yellow / green / blue','red');if(!['red','yellow','green','blue'].includes(c))return;action('/api/play',{cardIndex:i,color:c})}else action('/api/play',{cardIndex:i})}</script></body></html>
