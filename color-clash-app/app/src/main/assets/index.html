<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Color Clash</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17110c;color:#fff;font-family:Arial,sans-serif}.hide{display:none!important}body{text-align:center}.home{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:14px;background:#151922}.panel{width:min(92vw,520px);background:#1d2028;border-radius:22px;padding:18px}.logo{font-size:clamp(28px,7vw,42px);font-weight:900}.sub{color:#ffd84d;font-weight:800;margin:2px 0 16px}input,button{width:100%;padding:13px;border:0;border-radius:13px;margin:5px 0;font-size:16px}button{background:#ffd84d;color:#17110c;font-weight:900}.secondary{background:#343a46;color:#fff}.joinHint{background:#161a22;padding:10px;border-radius:12px;margin:8px 0}.roomTools{display:flex;gap:8px}.table{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 45%,#ad6b36,#8b4e27 43%,#633518 78%,#4d2915)}.roomBadge,.turnBanner{position:absolute;z-index:30;top:7px;background:#211711df;border-radius:13px;padding:7px 11px;font-weight:900}.roomBadge{right:7px}.turnBanner{left:50%;transform:translateX(-50%)}.turnBanner.you{background:#ffd84d;color:#17110c}.opponents{position:absolute;z-index:8;top:50px;left:6px;right:6px;height:90px;display:flex;justify-content:center;gap:12px;pointer-events:none}.opp{width:82px;font-size:11px}.avatar{width:42px;height:42px;border-radius:50%;margin:auto;background:linear-gradient(#d8e7ef,#7892a3);border:3px solid #c8d4dc}.opp.active .avatar{border-color:#ffd84d;box-shadow:0 0 18px #ffd84d}.nameTag,.countTag{display:inline-block;background:#211711df;border-radius:8px;padding:2px 6px;margin-top:2px}.center{position:absolute;z-index:10;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;gap:22px}.deck,.card{width:82px;height:120px;border-radius:11px;border:6px solid #f7f3e9;box-shadow:0 6px 13px #0009}.deck{background:radial-gradient(ellipse,#e3332c 0 34%,#151515 36%);cursor:pointer}.card{--card:#222;position:relative;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:42px;background:var(--card);color:var(--card);overflow:hidden;text-shadow:-2px -2px #111,2px 2px #111}.card:before{content:"";position:absolute;width:78%;height:76%;background:#f3efe5;border-radius:52% 30%;transform:rotate(-10deg)}.card .big,.card .corner{position:relative;z-index:2}.card .corner{position:absolute;font-size:14px;color:#fff}.tl{top:5px;left:5px}.br{bottom:5px;right:5px;transform:rotate(180deg)}.red{--card:#ed1c24}.yellow{--card:#ffd400}.green{--card:#079447}.blue{--card:#087ac1}.wild{--card:#171717}.wild:before{background:conic-gradient(#079447 0 25%,#ed1c24 0 50%,#087ac1 0 75%,#ffd400 0);border-radius:50%;width:67%;height:45%}.wild .big{font-size:19px;color:#fff}#hand{position:absolute;z-index:15;left:50%;bottom:-15px;width:min(94vw,720px);height:190px;transform:translateX(-50%);pointer-events:none}.handCard{position:absolute;left:50%;bottom:35px;margin-left:-41px;transform-origin:50% 165%;cursor:pointer;pointer-events:auto;touch-action:manipulation}.toast{position:absolute;z-index:60;left:50%;top:48px;transform:translateX(-50%);background:#15100ded;padding:7px 12px;border-radius:10px}.chosenColor{position:absolute;z-index:35;left:50%;top:calc(46% + 72px);transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:#211711ed;padding:6px 10px;border-radius:12px;font-weight:900;font-size:12px}.colorDot{width:22px;height:22px;border-radius:50%;border:3px solid #fff}.colorOverlay{position:absolute;z-index:100;inset:0;background:#090603b8;display:flex;align-items:center;justify-content:center}.colorBox{width:min(88vw,390px);background:#211711f5;border-radius:24px;padding:18px}.colorTitle{font-size:23px;font-weight:900;margin-bottom:15px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:ltr}.colorBtn{height:82px;border:5px solid #fff;border-radius:20px;margin:0}.redB{background:#ed1c24}.yellowB{background:#ffd400}.greenB{background:#079447}.blueB{background:#087ac1}.cancelColor{margin-top:13px;background:#454545;color:#fff}.flyCard{position:fixed;z-index:95;width:38px;height:56px;border:4px solid #f5f2e9;border-radius:6px;background:radial-gradient(ellipse,#e3332c 0 34%,#151515 36%);pointer-events:none;transition:transform .52s ease,opacity .52s}.penaltyFlash{position:absolute;z-index:70;left:50%;top:27%;transform:translateX(-50%);background:#17110ce8;border:2px solid #ffd84d;border-radius:14px;padding:8px 14px;font-weight:900;font-size:18px}.turnSplash,.winOverlay{position:absolute;z-index:80;inset:0;display:flex;align-items:center;justify-content:center}.turnSplash{pointer-events:none}.turnSplash>div{background:#ffd84d;color:#17110c;padding:12px 22px;border-radius:20px;font-size:26px;font-weight:900}.winOverlay{background:#090603d9;padding:12px}.winCard{width:min(84vw,400px);background:#211711;border-radius:22px;padding:20px}.winTitle{font-size:28px;font-weight:900;color:#ffd84d}.confetti{position:absolute;width:8px;height:15px;top:-30px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-height:430px) and (orientation:landscape){.opponents{top:38px;height:55px}.opp{width:58px}.avatar{width:30px;height:30px}.center{top:43%}.deck,.card{width:62px;height:91px;border-width:5px}.card{font-size:31px}.handCard{margin-left:-31px;bottom:23px}#hand{height:142px;bottom:-15px}.roomBadge,.turnBanner{padding:5px 8px;font-size:11px}.chosenColor{top:calc(43% + 55px);font-size:10px}.colorDot{width:17px;height:17px}.colorBox{width:330px;padding:12px}.colorBtn{height:55px}}</style></head><body><div id="home" class="home"><div class="panel"><div class="logo">COLOR CLASH</div><div class="sub">LAN CARD GAME</div><div id="joinHint" class="joinHint hide"></div><input id="name" placeholder="اسم اللاعب"><div id="normalJoin"><button onclick="createRoom()">إنشاء لعبة</button><input id="roomInput" placeholder="رمز الغرفة" maxlength="5"><button class="secondary" onclick="joinRoom()">دخول الغرفة</button></div><button id="quickJoin" class="hide" onclick="joinRoom()">دخول الغرفة مباشرة</button><div id="homeMsg"></div></div></div><div id="lobby" class="home hide"><div class="panel"><div class="logo">COLOR CLASH</div><div>رمز الغرفة</div><div id="roomCode" style="font-size:30px;font-weight:900;color:#ffd84d"></div><div id="lobbyPlayers"></div><div class="roomTools"><button class="secondary" onclick="copyInvite()">نسخ رابط الدعوة</button><button class="secondary" onclick="shareInvite()">مشاركة</button></div><button id="startBtn" class="hide" onclick="action('/api/start')">ابدأ اللعبة</button></div></div><div id="board" class="table hide"><div class="roomBadge">📶 <span id="roomMini"></span></div><div id="turnBanner" class="turnBanner"></div><div id="opponents" class="opponents"></div><div id="toast" class="toast hide"></div><div class="center"><div id="deck" class="deck" onclick="action('/api/draw')"></div><div id="top"></div></div><div id="chosenColor" class="chosenColor hide"><span></span><i id="colorDot" class="colorDot"></i></div><div id="hand"></div><div id="turnSplash" class="turnSplash hide"><div>دورك الآن!</div></div><div id="colorOverlay" class="colorOverlay hide"><div class="colorBox"><div class="colorTitle">اختر اللون</div><div class="colors"><button class="colorBtn redB" onclick="chooseColor('red')"></button><button class="colorBtn yellowB" onclick="chooseColor('yellow')"></button><button class="colorBtn greenB" onclick="chooseColor('green')"></button><button class="colorBtn blueB" onclick="chooseColor('blue')"></button></div><button class="cancelColor" onclick="cancelColor()">إلغاء</button></div></div><div id="winOverlay" class="winOverlay hide"><div id="confettiLayer"></div><div class="winCard"><div style="font-size:48px">🏆</div><div id="winTitle" class="winTitle"></div><div id="winSub"></div><button id="rematchBtn" class="hide" onclick="action('/api/restart')">العب مرة أخرى</button><div id="waitingRematch" class="hide">بانتظار المضيف…</div></div></div></div><script>let room='',pid='',timer,lastTurn='',lastWinner=null,pendingWild=-1,prevCounts={};const $=id=>document.getElementById(id);function enc(o){return Object.entries(o).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:enc(data)});return r.json()}function inviteRoom(){return new URLSearchParams(location.search).get('room')||''}function init(){$('name').value=localStorage.getItem('cc_name')||'';let q=inviteRoom().toUpperCase();if(q){$('roomInput').value=q;$('joinHint').textContent='دعوة للغرفة '+q;$('joinHint').classList.remove('hide');$('normalJoin').classList.add('hide');$('quickJoin').classList.remove('hide')}}async function createRoom(){let n=$('name').value.trim();if(!n){$('homeMsg').textContent='اكتب اسمك';return}localStorage.setItem('cc_name',n);try{enter(await post('/api/create',{name:n}))}catch(e){$('homeMsg').textContent='تعذر إنشاء الغرفة'}}async function joinRoom(){let n=$('name').value.trim();if(!n){$('homeMsg').textContent='اكتب اسمك';return}localStorage.setItem('cc_name',n);try{enter(await post('/api/join',{name:n,room:$('roomInput').value||inviteRoom()}))}catch(e){$('homeMsg').textContent='تعذر الدخول'}}function enter(j){if(!j.ok){$('homeMsg').textContent=j.error;return}room=j.room;pid=j.playerId;history.replaceState(null,'','/?room='+room);$('home').classList.add('hide');$('lobby').classList.remove('hide');$('roomCode').textContent=room;$('roomMini').textContent=room;poll();clearInterval(timer);timer=setInterval(poll,650)}async function action(path,extra={}){try{let j=await post(path,{room,playerId:pid,...extra});if(!j.ok)toast(j.error);poll()}catch(e){toast('تعذر الاتصال باللعبة')}}function toast(t){let x=$('toast');x.textContent=t;x.classList.remove('hide');setTimeout(()=>x.classList.add('hide'),1600)}async function inviteUrl(){try{let j=await fetch('/api/info').then(r=>r.json());if(j.ok&&j.url)return j.url+'/?room='+room}catch(e){}return location.origin+'/?room='+room}async function copyInvite(){let u=await inviteUrl();try{await navigator.clipboard.writeText(u);toast('تم نسخ الرابط')}catch(e){}}async function shareInvite(){let u=await inviteUrl();if(navigator.share)navigator.share({title:'Color Clash',text:'انضم إلى الغرفة '+room,url:u});else copyInvite()}function label(v){return({skip:'⊘',reverse:'↔',draw2:'+2',wild:'WILD',wild4:'+4'})[v]||v}function card(c,i){if(!c)return'';let cl=c.color||'wild',v=label(c.value);return `<div class="card ${cl}${i>=0?' handCard':''}" ${i>=0?`onclick="tapCard(${i},${c.color===null})"`:''}><span class="corner tl">${v}</span><span class="big">${v}</span><span class="corner br">${v}</span></div>`}function tapCard(i,wild){if(wild){pendingWild=i;$('colorOverlay').classList.remove('hide')}else action('/api/play',{cardIndex:i})}async function chooseColor(color){if(pendingWild<0)return;$('colorOverlay').classList.add('hide');let i=pendingWild;pendingWild=-1;await action('/api/play',{cardIndex:i,color:color})}function cancelColor(){pendingWild=-1;$('colorOverlay').classList.add('hide')}function renderHand(cards){let n=cards.length;if(!n){$('hand').innerHTML='';return}let spread=Math.min(64,20+n*6),step=n>1?spread/(n-1):0,start=-spread/2,px=Math.min(30,250/Math.max(1,n-1));$('hand').innerHTML=cards.map((c,i)=>{let a=start+i*step,x=(i-(n-1)/2)*px,y=Math.abs(a)*.3;return card(c,i).replace('class="card',`style="transform:translate(${x}px,${y}px) rotate(${a}deg);z-index:${i+1}" class="card`)}).join('')}function showColor(j){let wild=j.top&&(j.top.value==='wild'||j.top.value==='wild4');$('chosenColor').classList.toggle('hide',!wild);if(!wild)return;let colors={red:'#ed1c24',yellow:'#ffd400',green:'#079447',blue:'#087ac1'},names={red:'أحمر',yellow:'أصفر',green:'أخضر',blue:'أزرق'};$('colorDot').style.background=colors[j.currentColor]||'#fff';$('chosenColor').querySelector('span').textContent='اللون المختار: '+(names[j.currentColor]||'')}function flyPenalty(targetName,count){let d=$('deck'),t=[...document.querySelectorAll('.opp')].find(x=>x.dataset.name===targetName);if(!d||!t)return;let a=d.getBoundingClientRect(),b=t.getBoundingClientRect();for(let i=0;i<count;i++){let f=document.createElement('i');f.className='flyCard';f.style.left=(a.left+a.width/2-19)+'px';f.style.top=(a.top+a.height/2-28)+'px';document.body.appendChild(f);setTimeout(()=>{f.style.transform='translate('+(b.left+b.width/2-(a.left+a.width/2))+'px,'+(b.top+b.height/2-(a.top+a.height/2))+'px) rotate('+(i*16)+'deg)';f.style.opacity='.2'},80+i*100);setTimeout(()=>f.remove(),800+i*100)}let m=document.createElement('div');m.className='penaltyFlash';m.textContent='+'+count+' بطاقات إلى '+targetName;$('board').appendChild(m);setTimeout(()=>m.remove(),1100)}function makeConfetti(){let l=$('confettiLayer');l.innerHTML='';for(let i=0;i<60;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.background=['#ffd84d','#ed1c24','#079447','#087ac1','#fff'][i%5];l.appendChild(e)}}async function poll(){if(!room)return;try{let j=await fetch('/api/status?'+enc({room,playerId:pid})).then(r=>r.json());if(!j.ok)return;$('lobbyPlayers').innerHTML=j.players.map(p=>`<div style="padding:5px">${p.you?'أنت — ':''}${p.name}</div>`).join('');$('startBtn').classList.toggle('hide',!j.isHost||j.started||j.winner);if(j.started){$('lobby').classList.add('hide');$('board').classList.remove('hide')}let me=j.players.find(p=>p.you),turnP=j.players.find(p=>p.turn);if(j.started){$('turnBanner').textContent=me&&me.turn?'دورك الآن':'دور '+(turnP?turnP.name:'');$('turnBanner').classList.toggle('you',!!(me&&me.turn));if(turnP&&turnP.name!==lastTurn){if(me&&me.turn){$('turnSplash').classList.remove('hide');setTimeout(()=>$('turnSplash').classList.add('hide'),900)}lastTurn=turnP.name}$('top').innerHTML=card(j.top,-1);renderHand(j.hand);showColor(j)}$('opponents').innerHTML=j.players.filter(p=>!p.you).map(p=>`<div class="opp ${p.turn?'active':''}" data-name="${p.name.replace(/"/g,'&quot;')}"><div class="avatar"></div><div class="nameTag">${p.name}</div><div class="countTag">${p.count} بطاقات</div></div>`).join('');j.players.filter(p=>!p.you).forEach(p=>{let old=prevCounts[p.name];if(old!=null){let diff=p.count-old;if(diff===2||diff===4)flyPenalty(p.name,diff)}});prevCounts={};j.players.forEach(p=>prevCounts[p.name]=p.count);if(j.winner){$('board').classList.remove('hide');$('winOverlay').classList.remove('hide');let won=me&&me.name===j.winner;$('winTitle').textContent=won?'مبروك! لقد فزت 🎉':j.winner+' فاز بالجولة';$('winSub').textContent=won?'أحسنت!':'حظ أوفر في المرة القادمة';$('rematchBtn').classList.toggle('hide',!j.isHost);$('waitingRematch').classList.toggle('hide',j.isHost);if(lastWinner!==j.winner){makeConfetti();lastWinner=j.winner}}else{$('winOverlay').classList.add('hide');lastWinner=null}}catch(e){}}init()</script></body></html>
