<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Color Clash</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0e1117;color:#fff;font-family:Arial,sans-serif}body{text-align:center}.wrap{max-width:980px;margin:auto;padding:14px}.brand h1{font-size:34px;margin:8px 0 0}.brand .sub{color:#ffd54a;font-weight:800}.panel{background:#1b202b;border-radius:22px;padding:18px;margin:16px auto;max-width:620px}input,button{width:100%;padding:14px;border:0;border-radius:13px;margin:6px 0;font-size:17px}button{background:#ffd54a;color:#111;font-weight:800}.secondary{background:#303847;color:#fff}.hide{display:none}.code{font-size:30px;letter-spacing:4px;color:#ffd54a;font-weight:900}.players{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.player{background:#292f3b;padding:8px 11px;border-radius:12px}.turn{outline:3px solid #ffd54a}
.gameTable{position:relative;width:100%;height:min(100vh,640px);min-height:520px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 46%,#a96132 0,#8b4b25 46%,#643417 100%);box-shadow:inset 0 0 70px #0008,0 10px 28px #0008}.gameTable:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(2deg,#fff0 0 42px,#ffffff13 43px 45px,#0000 46px 90px);opacity:.35;mix-blend-mode:soft-light}.hud{position:absolute;z-index:20;top:14px;right:16px;display:flex;gap:10px;align-items:center}.wifi{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#211913dd;font-size:28px}.roomBox{background:#211913dd;padding:10px 14px;border-radius:15px;text-align:left;font-weight:800;line-height:1.25}.menuBtn,.chatBtn{position:absolute;z-index:20;width:62px;height:62px;border-radius:16px;background:#211913dd;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}.menuBtn{top:14px;left:16px}.chatBtn{bottom:16px;left:16px;font-size:27px}.turnText{position:absolute;z-index:15;top:16px;left:50%;transform:translateX(-50%);background:#211913dd;padding:9px 15px;border-radius:18px;font-weight:800}
.opponent{position:absolute;z-index:8;width:126px;text-align:center}.opponent.top{top:14px;left:50%;transform:translateX(-50%)}.opponent.left{left:18px;top:50%;transform:translateY(-50%)}.opponent.right{right:18px;top:50%;transform:translateY(-50%)}.opponent.extra1{top:20%;left:22%}.opponent.extra2{top:20%;right:22%}.avatar{width:66px;height:66px;margin:auto;border-radius:50%;border:5px solid #dfeaf0;background:radial-gradient(circle at 50% 38%,#dbe3e8 0 16%,#a6b4bf 17% 35%,#16344b 36% 100%);box-shadow:0 3px 8px #0007}.opponent.active .avatar{border-color:#21b653;box-shadow:0 0 0 4px #21b65355}.nameTag{display:inline-block;margin-top:-4px;background:#201713e8;padding:5px 18px;border-radius:12px;font-weight:800}.oppFan{position:relative;width:110px;height:70px;margin:-4px auto 0}.backCard{position:absolute;width:46px;height:66px;border-radius:7px;border:4px solid #eee;background:radial-gradient(ellipse at center,#de322d 0 34%,#141414 35% 100%);box-shadow:0 3px 7px #0008}.oppFan .backCard:nth-child(1){left:20px;transform:rotate(-18deg)}.oppFan .backCard:nth-child(2){left:34px;transform:rotate(-7deg)}.oppFan .backCard:nth-child(3){left:48px;transform:rotate(8deg)}.oppFan .backCard:nth-child(4){left:61px;transform:rotate(18deg)}.countBadge{position:absolute;right:0;bottom:1px;background:#181818e8;border:2px solid #888;border-radius:10px;padding:4px 8px;font-size:17px;font-weight:900}
.centerArea{position:absolute;z-index:7;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;gap:28px;align-items:center}.deck{width:112px;height:164px;border-radius:14px;border:8px solid #eee;background:radial-gradient(ellipse,#df312b 0 34%,#121212 35% 100%);box-shadow:0 10px 16px #0008,0 6px 0 #d8d8d8;cursor:pointer;position:relative}.deck:after{content:"COLOR\A CLASH";white-space:pre;position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:900;color:#ffd43c;transform:rotate(-16deg);text-shadow:1px 2px 2px #000}.card{--card:#222;position:relative;width:112px;height:164px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:56px;border:8px solid #f7f3e9;box-shadow:0 7px 14px #0009,inset 0 0 0 2px #0003;background:var(--card);color:var(--card);overflow:hidden;text-shadow:-2px -2px 0 #111,2px -2px 0 #111,-2px 2px 0 #111,2px 2px 0 #111}.card:before{content:"";position:absolute;width:82%;height:77%;background:#f5f1e8;border-radius:52% 28% 52% 28%;transform:rotate(-11deg);box-shadow:inset 0 0 8px #0002}.card .big{position:relative;z-index:2;line-height:1}.card .corner{position:absolute;z-index:3;font-size:20px;line-height:1;color:#fff;text-shadow:-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111,1px 1px 0 #111}.card .tl{top:8px;left:8px}.card .br{bottom:8px;right:8px;transform:rotate(180deg)}.red{--card:#ed1c24}.yellow{--card:#ffd400}.green{--card:#079447}.blue{--card:#087ac1}.wild{--card:#171717;background:#171717}.wild:before{background:conic-gradient(#079447 0 25%,#ed1c24 0 50%,#087ac1 0 75%,#ffd400 0);border-radius:50%;width:68%;height:47%;transform:rotate(-12deg)}.wild .big{font-size:28px;color:#fff}.action .big{font-size:40px;color:var(--card)}
.handArea{position:absolute;z-index:12;left:50%;bottom:-8px;transform:translateX(-50%);width:760px;height:270px;pointer-events:none}.hand{position:absolute;left:50%;bottom:8px;width:720px;height:250px;transform:translateX(-50%);pointer-events:auto}.hand .card{position:absolute;left:50%;bottom:8px;margin-left:-56px;transform-origin:50% 175%;transition:.18s ease;cursor:pointer}.hand .card.selected{bottom:34px;filter:drop-shadow(0 0 10px #fff8)}.playBtn{position:absolute;z-index:20;right:22px;bottom:18px;width:170px;background:#836148cc;color:#fff;border:2px solid #d4c6bb;border-radius:16px}.restart{position:absolute;z-index:20;right:22px;bottom:78px;width:170px}.msg{position:absolute;z-index:18;left:50%;top:66%;transform:translate(-50%,-50%);background:#111c;padding:7px 13px;border-radius:12px;max-width:54%}
@media(max-height:560px){.gameTable{height:100vh;min-height:480px}.opponent{transform:scale(.86)}.opponent.top{transform:translateX(-50%) scale(.86)}.opponent.left{transform:translateY(-50%) scale(.86)}.opponent.right{transform:translateY(-50%) scale(.86)}.centerArea{top:43%;transform:translate(-50%,-50%) scale(.86)}.handArea{transform:translateX(-50%) scale(.88);transform-origin:bottom center}.playBtn{bottom:10px}}
</style></head><body><div class="wrap"><div class="brand"><h1>COLOR CLASH</h1><div class="sub">LAN CARD GAME</div></div><div id="home" class="panel"><input id="name" placeholder="اسم اللاعب"><button onclick="createRoom()">إنشاء لعبة</button><input id="roomInput" placeholder="رمز الغرفة" maxlength="5"><button class="secondary" onclick="joinRoom()">دخول الغرفة</button><div id="homeMsg"></div></div><div id="game" class="hide"><div class="panel" id="lobby"><div>رمز الغرفة</div><div id="roomCode" class="code"></div><div id="players" class="players"></div><button id="startBtn" class="hide" onclick="action('/api/start')">ابدأ اللعبة</button></div><div id="board" class="gameTable hide"><div class="menuBtn">☰</div><div class="hud"><div class="wifi">⌁</div><div class="roomBox">Room: <span id="roomMini"></span><br><span id="joinedCount"></span></div></div><div id="turnText" class="turnText"></div><div id="opponents"></div><div id="msg" class="msg"></div><div class="centerArea"><div class="deck" onclick="action('/api/draw')"></div><div id="top"></div></div><div class="handArea"><div id="hand" class="hand"></div></div><button class="playBtn" onclick="playSelected()">Play Card</button><button id="restart" class="restart hide" onclick="action('/api/restart')">لعبة جديدة</button><div class="chatBtn">💬</div></div></div></div><script>let room='',pid='',timer,selectedIndex=-1,currentHand=[];const $=id=>document.getElementById(id);function enc(o){return Object.entries(o).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:enc(data)});return r.json()}async function createRoom(){enter(await post('/api/create',{name:$('name').value}))}async function joinRoom(){enter(await post('/api/join',{name:$('name').value,room:$('roomInput').value}))}function enter(j){if(!j.ok){$('homeMsg').textContent=j.error;return}room=j.room;pid=j.playerId;$('home').classList.add('hide');$('game').classList.remove('hide');$('roomCode').textContent=room;$('roomMini').textContent=room;poll();timer=setInterval(poll,900)}async function action(path,extra={}){let j=await post(path,{room,playerId:pid,...extra});$('msg').textContent=j.ok?'':j.error;selectedIndex=-1;poll()}async function poll(){if(!room)return;let j=await fetch('/api/status?'+enc({room,playerId:pid})).then(r=>r.json());if(!j.ok)return;$('players').innerHTML=j.players.map(p=>`<span class="player ${p.turn?'turn':''}">${p.you?'أنت: ':''}${p.name} (${p.count})</span>`).join('');$('joinedCount').textContent='👥 '+j.players.length+' / 8';$('startBtn').classList.toggle('hide',!j.isHost||j.started||j.winner);$('board').classList.toggle('hide',!j.started);$('lobby').classList.toggle('hide',j.started);$('restart').classList.toggle('hide',!j.winner||!j.isHost);renderOpponents(j.players.filter(p=>!p.you));if(j.winner){$('msg').textContent='الفائز: '+j.winner;return}if(!j.started)return;let me=j.players.find(p=>p.you);$('turnText').textContent=me&&me.turn?'دورك الآن':'انتظر دورك';$('top').innerHTML=card(j.top,-1);currentHand=j.hand;renderHand(j.hand)}function renderOpponents(ps){let slots=['top','left','right','extra1','extra2'];$('opponents').innerHTML=ps.slice(0,5).map((p,i)=>`<div class="opponent ${slots[i]} ${p.turn?'active':''}"><div class="avatar"></div><div class="nameTag">${p.name}</div><div class="oppFan"><i class="backCard"></i><i class="backCard"></i><i class="backCard"></i><i class="backCard"></i><span class="countBadge">${p.count}</span></div></div>`).join('')}function label(v){return({skip:'⊘',reverse:'↔',draw2:'+2',wild:'WILD',wild4:'+4'})[v]||v}function card(c,i){if(!c)return'';let cl=c.color||'wild',v=label(c.value),act=isNaN(Number(c.value))?' action':'',sel=i===selectedIndex?' selected':'';return `<div class="card ${cl}${act}${sel}" ${i>=0?`onclick="selectCard(${i})"`:''}><span class="corner tl">${v}</span><span class="big">${v}</span><span class="corner br">${v}</span></div>`}function renderHand(cards){let n=cards.length,spread=Math.min(76,Math.max(32,n*9)),step=n>1?spread/(n-1):0,start=-spread/2;$('hand').innerHTML=cards.map((c,i)=>{let a=start+i*step,x=(i-(n-1)/2)*Math.min(43,360/Math.max(1,n-1)),y=Math.abs(a)*.45;return card(c,i).replace('class="card','style="transform:translate('+x+'px,'+y+'px) rotate('+a+'deg);z-index:'+(i+1)+'" class="card')}).join('')}function selectCard(i){selectedIndex=i;renderHand(currentHand)}function playSelected(){if(selectedIndex<0){$('msg').textContent='اختر بطاقة أولاً';return}let c=currentHand[selectedIndex];if(c.color===null){let col=prompt('اختر اللون: red / yellow / green / blue','red');if(!['red','yellow','green','blue'].includes(col))return;action('/api/play',{cardIndex:selectedIndex,color:col})}else action('/api/play',{cardIndex:selectedIndex})}</script></body></html>
