<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Color Clash</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17110c;color:#fff;font-family:Arial,sans-serif}body{text-align:center}.hide{display:none!important}button,input{font:inherit}.home{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:#151922;overflow:auto}.panel{width:min(92vw,520px);background:#1d2028;border-radius:22px;padding:18px;box-shadow:0 10px 30px #0008}.logo{font-size:clamp(28px,7vw,42px);font-weight:900}.sub{color:#ffd84d;font-weight:800;margin:2px 0 16px}input,button{width:100%;padding:13px;border:0;border-radius:13px;margin:5px 0;font-size:16px}button{background:#ffd84d;color:#17110c;font-weight:900}.secondary{background:#343a46;color:#fff}.joinHint{background:#161a22;padding:10px;border-radius:12px;margin:8px 0;color:#dfe6ef}.roomTools{display:flex;gap:8px}.table{position:fixed;inset:0;width:100dvw;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 45%,#ad6b36 0,#8b4e27 43%,#633518 78%,#4d2915 100%)}.table:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;background:repeating-linear-gradient(2deg,transparent 0 24px,#fff 25px 26px,transparent 27px 50px)}.roomBadge,.turnBanner{position:absolute;z-index:30;top:max(7px,env(safe-area-inset-top));background:#211711df;border:1px solid #ffffff28;box-shadow:0 4px 12px #0005;border-radius:13px;padding:7px 11px;font-weight:900;font-size:clamp(11px,2vw,16px)}.roomBadge{right:max(7px,env(safe-area-inset-right))}.turnBanner{left:50%;transform:translateX(-50%);min-width:min(40vw,230px);max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.turnBanner.you{background:#ffd84def;color:#1a130c;box-shadow:0 0 0 3px #fff4,0 0 22px #ffd84daa;animation:pulse 1s infinite alternate}.opponents{position:absolute;z-index:8;top:clamp(50px,10vh,76px);left:max(6px,env(safe-area-inset-left));right:max(6px,env(safe-area-inset-right));height:clamp(66px,17vh,106px);display:flex;align-items:flex-start;justify-content:center;gap:clamp(4px,2.5vw,24px);pointer-events:none}.opp{width:clamp(64px,13vw,108px);font-size:clamp(9px,1.6vw,13px)}.avatar{width:clamp(34px,6vw,52px);height:clamp(34px,6vw,52px);border-radius:50%;margin:auto;background:linear-gradient(#d8e7ef,#7892a3);border:3px solid #c8d4dc;position:relative}.opp.active .avatar{border-color:#ffd84d;box-shadow:0 0 0 4px #ffd84d55,0 0 20px #ffd84d;animation:avatarPulse .7s infinite alternate}.opp.active .avatar:after{content:"▼";position:absolute;top:-21px;left:50%;transform:translateX(-50%);color:#ffd84d;font-size:16px}.nameTag,.countTag{display:inline-block;background:#211711df;border-radius:8px;padding:2px 6px;margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.miniCards{height:25px;position:relative;width:56px;margin:2px auto}.back{position:absolute;width:18px;height:26px;border:2px solid #eee;border-radius:4px;background:radial-gradient(ellipse,#e3332c 0 34%,#151515 36% 100%)}.back:nth-child(1){left:9px;transform:rotate(-12deg)}.back:nth-child(2){left:19px}.back:nth-child(3){left:29px;transform:rotate(12deg)}.center{position:absolute;z-index:10;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:clamp(10px,3vw,28px)}.deck,.card{width:clamp(64px,11vw,102px);height:clamp(94px,16vw,148px);border-radius:clamp(8px,1.2vw,13px);border:clamp(5px,.7vw,7px) solid #f7f3e9;box-shadow:0 6px 13px #0009}.deck{background:radial-gradient(ellipse,#e3332c 0 34%,#151515 36% 100%);cursor:pointer;position:relative}.deck:after{content:"اسحب";position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:10px;background:#211711df;padding:3px 6px;border-radius:7px;color:#fff}.card{--card:#222;position:relative;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(32px,6vw,52px);background:var(--card);color:var(--card);overflow:hidden;text-shadow:-2px -2px 0 #111,2px -2px 0 #111,-2px 2px 0 #111,2px 2px 0 #111}.card:before{content:"";position:absolute;width:78%;height:76%;background:#f3efe5;border-radius:52% 30% 52% 30%;transform:rotate(-10deg)}.card .big{position:relative;z-index:2}.card .corner{position:absolute;z-index:3;font-size:clamp(11px,1.8vw,17px);color:#fff;text-shadow:-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111,1px 1px 0 #111}.tl{top:5px;left:5px}.br{bottom:5px;right:5px;transform:rotate(180deg)}.red{--card:#ed1c24}.yellow{--card:#ffd400}.green{--card:#079447}.blue{--card:#087ac1}.wild{--card:#171717;background:#171717}.wild:before{background:conic-gradient(#079447 0 25%,#ed1c24 0 50%,#087ac1 0 75%,#ffd400 0);border-radius:50%;width:67%;height:45%}.wild .big{font-size:clamp(16px,2.8vw,24px);color:#fff}.action .big{font-size:clamp(22px,4.5vw,36px);color:var(--card)}#hand{position:absolute;z-index:15;left:50%;bottom:max(-18px,calc(env(safe-area-inset-bottom) - 18px));width:min(94vw,720px);height:clamp(145px,36vh,285px);transform:translateX(-50%);pointer-events:none}.handCard{position:absolute;left:50%;bottom:clamp(25px,6vh,50px);margin-left:calc(clamp(64px,11vw,102px)/-2);transform-origin:50% 165%;transition:.10s ease;cursor:pointer;pointer-events:auto;touch-action:manipulation}.handCard:active{filter:brightness(1.12);bottom:clamp(34px,8vh,65px)!important;z-index:120!important}.yourTurnGlow{position:absolute;z-index:5;left:50%;bottom:0;transform:translateX(-50%);width:82%;height:32vh;border-radius:50% 50% 0 0;box-shadow:inset 0 -24px 75px #ffd84d55;pointer-events:none;opacity:0}.yourTurnGlow.show{opacity:1;animation:glow .8s infinite alternate}.toast{position:absolute;z-index:60;left:50%;top:calc(max(7px,env(safe-area-inset-top)) + 42px);transform:translateX(-50%);background:#15100ded;padding:7px 12px;border-radius:10px;max-width:82vw;font-size:13px}.turnSplash,.winOverlay{position:absolute;z-index:80;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.turnSplash>div{background:#ffd84df2;color:#17110c;padding:12px 22px;border-radius:20px;font-size:clamp(20px,4vw,32px);font-weight:900;box-shadow:0 0 40px #ffd84dcc;animation:splash .9s forwards}.winOverlay{background:#090603d9;pointer-events:auto;padding:12px}.winCard{width:min(84vw,400px);max-height:84vh;overflow:auto;background:#211711f5;border:1px solid #ffffff30;border-radius:22px;padding:20px;box-shadow:0 18px 70px #000}.trophy{font-size:48px}.winTitle{font-size:clamp(24px,4.5vw,34px);font-weight:900;color:#ffd84d}.winSub{font-size:15px;color:#ddd;margin:8px 0 14px}.rematchBtn{background:#ffd84d;color:#1b130d}.waitingRematch{color:#ddd;background:#ffffff12;padding:9px;border-radius:10px}.confetti{position:absolute;width:8px;height:15px;top:-30px;animation:fall linear forwards}@keyframes pulse{to{transform:translateX(-50%) scale(1.05)}}@keyframes avatarPulse{to{transform:scale(1.08)}}@keyframes glow{to{box-shadow:inset 0 -35px 100px #ffd84d88}}@keyframes splash{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.06)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(orientation:portrait){.opponents{top:52px;height:82px;gap:3px}.opp{width:58px}.avatar{width:31px;height:31px}.center{top:43%}.deck,.card{width:66px;height:97px;border-width:5px}.card{font-size:34px}.handCard{margin-left:-33px}#hand{height:225px;bottom:-5px}.roomBadge{font-size:10px;padding:6px 8px}.turnBanner{font-size:12px;padding:6px 9px;min-width:130px;max-width:62vw}.miniCards{display:none}.countTag,.nameTag{font-size:9px}.winCard{width:90vw}}@media(max-height:430px) and (orientation:landscape){.opponents{top:40px;height:58px}.opp{width:58px}.avatar{width:31px;height:31px}.miniCards{display:none}.nameTag,.countTag{font-size:9px}.center{top:44%}.deck,.card{width:62px;height:91px;border-width:5px}.card{font-size:32px}.handCard{margin-left:-31px;bottom:24px}#hand{height:145px;bottom:-16px}.roomBadge,.turnBanner{padding:5px 8px;font-size:11px}.yourTurnGlow{height:120px}.winCard{padding:14px}.trophy{font-size:38px}}</style></head><body><div id="home" class="home"><div class="panel"><div class="logo">COLOR CLASH</div><div class="sub">LAN CARD GAME</div><div id="joinHint" class="joinHint hide"></div><input id="name" placeholder="اسم اللاعب"><div id="normalJoin"><button onclick="createRoom()">إنشاء لعبة</button><input id="roomInput" placeholder="رمز الغرفة" maxlength="5"><button class="secondary" onclick="joinRoom()">دخول الغرفة</button></div><button id="quickJoin" class="hide" onclick="joinRoom()">دخول الغرفة مباشرة</button><div id="homeMsg"></div></div></div><div id="lobby" class="home hide"><div class="panel"><div class="logo">COLOR CLASH</div><div>رمز الغرفة</div><div id="roomCode" style="font-size:30px;font-weight:900;color:#ffd84d;letter-spacing:5px"></div><div id="lobbyPlayers"></div><div class="roomTools"><button class="secondary" onclick="copyInvite()">نسخ رابط الدعوة</button><button class="secondary" onclick="shareInvite()">مشاركة</button></div><button id="startBtn" class="hide" onclick="action('/api/start')">ابدأ اللعبة</button></div></div><div id="board" class="table hide"><div class="roomBadge">📶 <span id="roomMini"></span></div><div id="turnBanner" class="turnBanner"></div><div id="opponents" class="opponents"></div><div id="toast" class="toast hide"></div><div class="center"><div class="deck" onclick="action('/api/draw')"></div><div id="top"></div></div><div id="yourTurnGlow" class="yourTurnGlow"></div><div id="hand"></div><div id="turnSplash" class="turnSplash hide"><div>دورك الآن!</div></div><div id="winOverlay" class="winOverlay hide"><div id="confettiLayer"></div><div class="winCard"><div class="trophy">🏆</div><div id="winTitle" class="winTitle"></div><div id="winSub" class="winSub"></div><button id="rematchBtn" class="rematchBtn hide" onclick="action('/api/restart')">العب مرة أخرى</button><div id="waitingRematch" class="waitingRematch hide">بانتظار المضيف لبدء جولة جديدة…</div></div></div></div><script>let room='',pid='',timer,lastTurn='',lastWinner=null;const $=id=>document.getElementById(id);function enc(o){return Object.entries(o).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:enc(data)});return r.json()}function inviteRoom(){return new URLSearchParams(location.search).get('room')||''}function init(){$('name').value=localStorage.getItem('cc_name')||'';let q=inviteRoom().toUpperCase();if(q){$('roomInput').value=q;$('joinHint').textContent='دعوة للغرفة '+q;$('joinHint').classList.remove('hide');$('normalJoin').classList.add('hide');$('quickJoin').classList.remove('hide')}}async function createRoom(){localStorage.setItem('cc_name',$('name').value.trim());enter(await post('/api/create',{name:$('name').value}))}async function joinRoom(){localStorage.setItem('cc_name',$('name').value.trim());enter(await post('/api/join',{name:$('name').value,room:$('roomInput').value||inviteRoom()}))}function enter(j){if(!j.ok){$('homeMsg').textContent=j.error;return}room=j.room;pid=j.playerId;history.replaceState(null,'','/?room='+room);$('home').classList.add('hide');$('lobby').classList.remove('hide');$('roomCode').textContent=room;$('roomMini').textContent=room;poll();clearInterval(timer);timer=setInterval(poll,650)}async function action(path,extra={}){let j=await post(path,{room,playerId:pid,...extra});if(!j.ok)toast(j.error);poll()}function toast(t){let x=$('toast');x.textContent=t;x.classList.remove('hide');setTimeout(()=>x.classList.add('hide'),1600)}function inviteUrl(){return location.origin+'/?room='+room}async function copyInvite(){try{await navigator.clipboard.writeText(inviteUrl());toast('تم نسخ الرابط')}catch(e){prompt('انسخ الرابط',inviteUrl())}}function shareInvite(){if(navigator.share)navigator.share({title:'Color Clash',text:'انضم إلى الغرفة '+room,url:inviteUrl()});else copyInvite()}function label(v){return({skip:'⊘',reverse:'↔',draw2:'+2',wild:'WILD',wild4:'+4'})[v]||v}function card(c,i){if(!c)return'';let cl=c.color||'wild',v=label(c.value),act=isNaN(Number(c.value))?' action':'';return `<div class="card ${cl}${act}${i>=0?' handCard':''}" ${i>=0?`onclick="tapCard(${i},${c.color===null})"`:''}><span class="corner tl">${v}</span><span class="big">${v}</span><span class="corner br">${v}</span></div>`}async function tapCard(i,wild){if(wild){let c=prompt('اختر اللون: red / yellow / green / blue','red');if(!['red','yellow','green','blue'].includes(c))return;await action('/api/play',{cardIndex:i,color:c})}else await action('/api/play',{cardIndex:i})}function renderHand(cards){let n=cards.length;if(!n){$('hand').innerHTML='';return}let spread=Math.min(64,20+n*6),step=n>1?spread/(n-1):0,start=-spread/2,px=Math.min(30,250/Math.max(1,n-1));$('hand').innerHTML=cards.map((c,i)=>{let a=start+i*step,x=(i-(n-1)/2)*px,y=Math.abs(a)*.30;return card(c,i).replace('class="card',`style="transform:translate(${x}px,${y}px) rotate(${a}deg);z-index:${i+1}" class="card`) }).join('')}function makeConfetti(){let l=$('confettiLayer');l.innerHTML='';for(let i=0;i<60;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.background=['#ffd84d','#ed1c24','#079447','#087ac1','#fff'][i%5];e.style.animationDuration=(1.8+Math.random()*2.2)+'s';e.style.animationDelay=(Math.random()*.7)+'s';l.appendChild(e)}}async function poll(){if(!room)return;let j=await fetch('/api/status?'+enc({room,playerId:pid})).then(r=>r.json());if(!j.ok)return;$('lobbyPlayers').innerHTML=j.players.map(p=>`<div style="padding:5px">${p.you?'أنت — ':''}${p.name}</div>`).join('');$('startBtn').classList.toggle('hide',!j.isHost||j.started||j.winner);if(j.started){$('lobby').classList.add('hide');$('board').classList.remove('hide')}let me=j.players.find(p=>p.you),turnP=j.players.find(p=>p.turn);if(j.started){$('turnBanner').textContent=me&&me.turn?'دورك الآن':'دور '+(turnP?turnP.name:'');$('turnBanner').classList.toggle('you',!!(me&&me.turn));$('yourTurnGlow').classList.toggle('show',!!(me&&me.turn));if(turnP&&turnP.name!==lastTurn){if(me&&me.turn){$('turnSplash').classList.remove('hide');setTimeout(()=>$('turnSplash').classList.add('hide'),900);try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}lastTurn=turnP.name}$('top').innerHTML=card(j.top,-1);renderHand(j.hand)}$('opponents').innerHTML=j.players.filter(p=>!p.you).map(p=>`<div class="opp ${p.turn?'active':''}"><div class="avatar"></div><div class="nameTag">${p.name}</div><div class="miniCards"><i class="back"></i><i class="back"></i><i class="back"></i></div><div class="countTag">${p.count}</div></div>`).join('');if(j.winner){$('board').classList.remove('hide');$('winOverlay').classList.remove('hide');let won=me&&me.name===j.winner;$('winTitle').textContent=won?'مبروك! لقد فزت 🎉':j.winner+' فاز بالجولة';$('winSub').textContent=won?'أحسنت!':'حظ أوفر في المرة القادمة';$('rematchBtn').classList.toggle('hide',!j.isHost);$('waitingRematch').classList.toggle('hide',j.isHost);if(lastWinner!==j.winner){makeConfetti();lastWinner=j.winner}}else{$('winOverlay').classList.add('hide');lastWinner=null}}init()</script></body></html>
